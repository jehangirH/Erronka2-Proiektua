name: Dokumentuak argitaratu

# 1) Zubizarreta_Gailetak_dokumentuak*.zip bat igotzen bada, deskonprimitu eta irakasgaika antolatzen du.
# 2) docs/dokumentuak/ karpetako .docx guztiei diseinu bateratua eta aurkibidea ematen die
#    (.github/scripts/dokumentuak_diseinua.py).
on:
  push:
    branches: [main]
    paths:
      - '**Zubizarreta_Gailetak_dokumentuak*.zip'
      - '.github/scripts/dokumentuak_diseinua.py'
      - '.github/workflows/dokumentuak.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dokumentuak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip-a deskonprimitu eta irakasgaika antolatu (badago)
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          zips=( **/Zubizarreta_Gailetak_dokumentuak*.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "Ez dago zip-ik"; exit 0; fi
          tmp=$(mktemp -d)
          for z in "${zips[@]}"; do unzip -o -q "$z" -d "$tmp"; done
          dest=docs/dokumentuak
          put() {
            f=$(find "$tmp" -type f -name "$2" | head -n1)
            if [ -n "$f" ]; then mkdir -p "$dest/$1"; cp "$f" "$dest/$1/$2"; echo "OK    $1/$2"; else echo "FALTA $2"; fi
          }
          put ESJ     erronka2_web___Akatsen_txostena_laburtua.docx
          put OF      Python_automatizazioa___Dokumentazioa.docx
          put HE      Auditoria_plana_eta_idatzizko_baimena_Zubizarreta_Gailetak.docx
          put HE      Pentesting_txostena_Zubizarreta_Gailetak.docx
          put AAI     Sareko_analisi_forentsearen_txostena.docx
          put AAI     Froga_digitalen_zaintza-katea.docx
          put AAI     Froga_digitalen_zaintza-katea_txantiloia.docx
          put ZAA     01_Compliance-plana.docx
          put ZAA     03_Datu_pertsonalen_babesa.docx
          put ZG-SGSI 02_SGSI.docx
          git rm -q -- "${zips[@]}"
      - name: Tresnak instalatu (LibreOffice, poppler, letra-tipoak)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea python3-lxml
      - name: Diseinu bateratua eta aurkibidea
        run: /usr/bin/python3 .github/scripts/dokumentuak_diseinua.py docs/dokumentuak
      - name: Aldaketak gorde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/dokumentuak
          if git diff --cached --quiet; then echo "Aldaketarik ez"; exit 0; fi
          git commit -m "Dokumentuak: diseinu bateratua eta aurkibidea"
          git push
