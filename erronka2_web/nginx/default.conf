# HTTP: dena HTTPSra birbideratu
server {
    listen 80;
    server_name _;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    # docker-compose.yml-ek muntatzen ditu (SSL_CERT eta SSL_KEY)
    ssl_certificate     /etc/nginx/ssl/erronka2.crt;
    ssl_certificate_key /etc/nginx/ssl/erronka2.key;

    # PHP-ren post_max_size-ren berdina; irudien 2 MB-ko muga aplikazioak kudeatzen du
    client_max_body_size 8m;

    # Docker-en DNSa: web edukiontzia birsortzean IP berria hartzeko
    resolver 127.0.0.11 valid=10s;

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;

        # Apache-k HTTP bidez jasotzen du eskaera: bere birbideraketak HTTPSra pasatu
        proxy_redirect http://$http_host/ https://$http_host/;

        # $http_host: portua mantentzen du Apache-ren birbideraketetan
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
